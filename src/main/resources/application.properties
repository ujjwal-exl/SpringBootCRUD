# TLS is required and the server certificate and hostname are verified (Connector/J 8+ sslMode=VERIFY_IDENTITY).
# For deployments, set SPRING_DATASOURCE_URL in the environment. It must keep sslMode=VERIFY_IDENTITY. Provide the CA truststore via trustCertificateKeyStoreUrl or the JVM truststore.
spring.datasource.url = jdbc:mysql://localhost:3306/user?sslMode=VERIFY_IDENTITY&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username = root
# The database password must come from the SPRING_DATASOURCE_PASSWORD environment variable or an external secret store.
# The password that used to be committed here is exposed. Revoke it and issue a new one; removing it from this file does not invalidate it.
# There is no default value on purpose: if SPRING_DATASOURCE_PASSWORD is not set, the application will fail to start.
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
# Schema changes must be applied through reviewed migrations, not by Hibernate at startup.
# 'validate' only checks that the entity mappings match the existing schema, so the runtime DB account needs no DDL privileges.
spring.jpa.hibernate.ddl-auto = validate


