# SECURITY: the MySQL connection must be TLS-encrypted and the server certificate verified (hostname
# included). sslMode=VERIFY_IDENTITY (Connector/J 8.x) refuses plaintext and untrusted/mismatched
# certificates. The trust store holding the MySQL CA is supplied at runtime through the
# DB_TRUSTSTORE_URL (e.g. file:/etc/app/mysql-truststore.jks) and DB_TRUSTSTORE_PASSWORD environment
# variables; Spring fails to start if either placeholder cannot be resolved. Never set useSSL=false here.
spring.datasource.url = jdbc:mysql://localhost:3306/user?sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}&trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD}&serverTimezone=UTC&useLegacyDatetimeCode=false
spring.datasource.username = root
# SECURITY: the datasource password previously hardcoded here was committed to the repository and
# must be revoked/rotated with the MySQL server. The replacement is supplied at runtime through the
# DB_PASSWORD environment variable; Spring fails to start if the placeholder cannot be resolved.
spring.datasource.password = ${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
# SECURITY: the runtime must never alter the live schema. 'validate' only checks that the entity
# mapping matches the existing schema and fails startup on mismatch; schema changes belong in
# reviewed migrations (Flyway/Liquibase) executed with a privileged account, while this datasource
# account needs DML only. Developers may override to 'update' via a local profile
# (e.g. application-dev.properties or SPRING_JPA_HIBERNATE_DDL_AUTO=update), never in this file.
spring.jpa.hibernate.ddl-auto = validate


